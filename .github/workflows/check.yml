name: Run Gold Price Alert

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes (the reliable minimum on GitHub)
  workflow_dispatch: # Allows you to manually click-run anytime

jobs:
  check-gold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Run script
        run: python alert.py
